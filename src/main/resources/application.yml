

spring:
  application:
    name: ecom-platform


  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


  security:
    oauth2:
      client:
        registration:

          # ── GOOGLE ─────────────────────────────────────────────
          # WHERE TO GET CREDENTIALS:
          # 1. Go to https://console.cloud.google.com
          # 2. Create a project → APIs & Services → Credentials
          # 3. Create OAuth 2.0 Client ID (Web Application type)
          # 4. Add Authorized redirect URI:
          #    http://localhost:8080/oauth2/callback/google
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - email
              - profile

          # ── GITHUB ─────────────────────────────────────────────
          # WHERE TO GET CREDENTIALS:
          # 1. Go to https://github.com/settings/developers
          # 2. New OAuth App
          # 3. Authorization callback URL:
          #    http://localhost:8080/oauth2/callback/github
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - user:email
              - read:user

        provider:
          github:
            # GitHub doesn't expose an OIDC discovery endpoint,
            # so we configure the user-info URI manually
            user-info-uri: https://api.github.com/user
            user-name-attribute: id



  data:
    mongodb:
      #      uri: ${MONGO_URI:mongodb://localhost:27017/ecom}
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE:ecom}


  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true


  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

    password: ${REDIS_PASSWORD}
    timeout: 2000ms
    lettuce:
      pool:
        min-idle: 2
        max-active: 10
        max-idle: 5


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

      retries: 3
      properties:
        batch.size: 16384
        linger.ms: 1
        enable.idempotence: true

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ecom-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      auto-offset-reset: earliest

      enable-auto-commit: false

      properties:
        spring.json.trusted.packages: "com.ecom.kafka.event"


    listener:
      ack-mode: MANUAL_IMMEDIATE

    topics:
      order-created: order-created
      payment-success: payment-success


  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    
    deserialization:
      fail-on-unknown-properties: false
    
    default-property-inclusion: non_null



server:
  port: ${SERVER_PORT:9092}

  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/json,application/xml,text/html,text/plain

  forward-headers-strategy: framework



management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics



app:
  jwt:
    #    secret: ${JWT_SECRET:your-super-secret-jwt;key-change-this-in-production-minimum-256-bits}
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRY:1800000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRY:604800000}
    token-prefix: "Bearer"
    header-name: "Authorization"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600



  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    upload-folder: ecom/products



  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}


  redis:
    ttl:
      product: 1800
      popular-products: 600
      user-session: 86400


    # Frontend URL — where to redirect after OAuth success/failure
    # This is where Spring sends the JWT tokens after successful login

    oauth2:
      authorized-redirect-uris: ${OAUTH2_REDIRECT_URIS}
      # How long the OAuth2 state cookie lives (10 minutes is more than enough
      # for a user to complete the Google/GitHub login flow)
      cookie-expire-seconds: 600


logging:
  level:
    com.ecom: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: WARN
    org.apache.kafka: WARN
    org.springframework: INFO

  file:
    name: logs/ecom
