

spring:
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE}

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: ${SERVER_PORT:8080}


management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never


logging:
  level:
    com.ecom: INFO
    org.springframework.security: WARN
    org.springframework: WARN
    org.apache.kafka: WARN



springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


