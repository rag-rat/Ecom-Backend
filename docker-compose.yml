

version: "3.9"


services:


  # ZOOKEEPER

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecom-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - ecom-net
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo ruok | nc localhost 2181" ]
      interval: 10s
      timeout: 5s
      retries: 5



  # KAFKA


  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecom-kafka
    ports:
      - "9093:9093"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181


      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0:0:0:0:29092, PLAINTEXT_HOST://0:0:0:0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168   # Keep messages 7 days

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ecom-net
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s



  # SPRING BOOT APPLICATION

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecom-app
    ports:
      - "9092:9092"
    depends_on:
#      mongodb:
#        condition: service_healthy
#      redis:
#        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092




    networks:
      - ecom-net

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s



# VOLUMES — persistent storage that survives container restarts
# Without named volumes, all data is lost when containers stop

volumes:
#  mongodb_data:
#  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:




networks:
  ecom-net:
    driver: bridge

